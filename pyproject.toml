[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argextender"
dynamic = ["version"]
description = "ARGextender: extend the genetic context of antimicrobial resistance genes by iterative read recruitment and targeted assembly"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["networkx>=3.4"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
argextender = "argextender.argextender:main"

[tool.setuptools]
packages = ["argextender"]

[tool.setuptools.dynamic]
version = { attr = "argextender.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tools: runs KMA, SPAdes and Bandage on the test data (skipped if a tool is missing)"]

[tool.ruff]
line-length = 120
target-version = "py311"
